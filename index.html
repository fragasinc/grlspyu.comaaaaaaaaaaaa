["DUPLA IMPROVÁVEL|UNLIKELY DUO|DÚO IMPROBABLE|UNGLEICHES DUO","O trabalho escolar que aproximou demais|The school project that brought them too close|El trabajo escolar que los acercó demasiado|Das Schulprojekt, das sie zu sehr zusammenbrachte","🤝","Theo e Bia foram sorteados para fazer o trabalho juntos e, segundo fontes, já brigaram quatro vezes só para escolher o tema. Ele diz que ela é mandona; ela diz que ele é um preguiçoso sem noção.\nMesmo assim, dizem que os dois não param de trocar mensagens até de madrugada.|Theo and Bia were paired up for a project and, according to sources, have already fought four times just to pick a topic. He says she's bossy; she says he's a clueless slacker.\nStill, they say the two keep texting each other until the early hours.|Theo y Bia fueron sorteados para hacer el trabajo juntos y, según fuentes, ya pelearon cuatro veces solo para elegir el tema. Él dice que ella es mandona; ella dice que él es un vago sin remedio.\nAun así, dicen que los dos no paran de escribirse hasta la madrugada.|Theo und Bia wurden für ein Projekt zusammengelost und haben sich laut Quellen schon viermal gestritten, nur um ein Thema zu wählen. Er sagt, sie sei herrisch; sie sagt, er sei ein ahnungsloser Faulpelz.\nTrotzdem schreiben die beiden sich angeblich bis tief in die Nacht."],
["SEGREDO REVELADO?|SECRET REVEALED?|¿SECRETO REVELADO?|GEHEIMNIS GELÜFTET?","Quase escapou!|It almost slipped out!|¡Casi se le escapa!|Fast verplappert!","🤫","Alguém ouviu a Lara cochichar: “Não conta pra ninguém, mas a gente está planejando…”. A frase foi cortada quando a Mel, a maior linguaruda da escola, chegou.\nAgora circulam três versões: festa surpresa, protesto contra a cantina ou, claro, mais uma mentira da Lara.|Someone overheard Lara whispering: “Don't tell anyone, but we're planning…” The sentence was cut off when Mel, the biggest blabbermouth in school, walked in.\nNow three versions are going around: a surprise party, a protest against the cafeteria, or, of course, yet another lie from Lara.|Alguien oyó a Lara susurrar: «No se lo cuentes a nadie, pero estamos planeando…». La frase se cortó cuando llegó Mel, la más chismosa del colegio.\nAhora circulan tres versiones: fiesta sorpresa, protesta contra la cantina o, claro, otra mentira de Lara.|Jemand hörte Lara flüstern: „Sag es niemandem, aber wir planen…“ Der Satz brach ab, als Mel, die größte Klatschtante der Schule, hereinkam.\nJetzt kursieren drei Versionen: eine Überraschungsparty, ein Protest gegen die Kantine oder natürlich wieder eine Lüge von Lara."],
["CIÚMES DETECTADOS|JEALOUSY DETECTED|CELOS DETECTADOS|EIFERSUCHT ENTDECKT","Quem disse que não se importava?|Who said she didn't care?|¿Quién dijo que no le importaba?|Wer sagte, es sei ihr egal?","💅","A Lara jurou que não ligava para o Pedro, mas bastou ele rir com a Duda para ela virar uma pedra de gelo. Dizem que ela rasgou um bilhete em mil pedaços no banheiro.\nSem ciúmes? Até a moça da cantina percebeu que a Lara é a pior mentirosa da escola.|Lara swore she didn't care about Pedro, but as soon as he laughed with Duda she turned to ice. They say she tore a note into a thousand pieces in the bathroom.\nNo jealousy? Even the lunch lady noticed Lara is the worst liar in school.|Lara juró que no le importaba Pedro, pero bastó verlo reír con Duda para que se volviera de hielo. Dicen que rompió una nota en mil pedazos en el baño.\n¿Sin celos? Hasta la cocinera notó que Lara es la peor mentirosa del colegio.|Lara schwor, Pedro sei ihr egal, doch kaum lachte er mit Duda, wurde sie zu Eis. Angeblich hat sie auf der Toilette einen Zettel in tausend Stücke gerissen.\nKeine Eifersucht? Sogar die Kantinenfrau hat bemerkt, dass Lara die schlechteste Lügnerin der Schule ist."],
["PLAYLIST SUSPEITA|SUSPICIOUS PLAYLIST|PLAYLIST SOSPECHOSA|VERDÄCHTIGE PLAYLIST","Essa música foi uma indireta?|Was that song a hint?|¿Esa canción fue una indirecta?|War dieser Song eine Andeutung?","🎧","O Caio criou uma playlist chamada “Para alguém que nunca percebe”, e a turma já montou uma lista de suspeitas. Dizem que a inspiração é a Luna, mas o gosto musical dele é tão ruim que ninguém sabe se é declaração ou castigo.\nSe a Luna ouvir até o fim, merece um prêmio de paciência.|Caio made a playlist called “For Someone Who Never Notices,” and the class has already drawn up a suspect list. They say Luna is the inspiration, but his taste in music is so bad nobody knows if it's a confession or a punishment.\nIf Luna listens to the end, she deserves a patience award.|Caio creó una playlist llamada «Para alguien que nunca se da cuenta» y la clase ya armó una lista de sospechosas. Dicen que la inspiración es Luna, pero su gusto musical es tan malo que nadie sabe si es una declaración o un castigo.\nSi Luna la escucha hasta el final, merece un premio a la paciencia.|Caio hat eine Playlist namens „Für jemanden, der es nie merkt“ erstellt, und die Klasse hat schon eine Verdächtigenliste. Angeblich ist Luna die Inspiration, aber sein Musikgeschmack ist so schlecht, dass keiner weiß, ob es ein Geständnis oder eine Strafe ist.\nWenn Luna bis zum Ende zuhört, verdient sie einen Geduldspreis."],
["PLANOS SECRETOS|SECRET PLANS|PLANES SECRETOS|GEHEIME PLÄNE","Todo mundo foi convidado… menos uma pessoa?|Everyone was invited… except one person?|¿Todos fueron invitados… menos una persona?|Alle wurden eingeladen… nur eine Person nicht?","🎟️","A Jade organizou um passeio no sábado e “esqueceu” de chamar a Duda. Dizem que foi de propósito, porque a Duda disse que a festa dela era chata.\nA Duda jura que vai aparecer de qualquer jeito. Prepare a pipoca.|Jade organized a Saturday outing and “forgot” to invite Duda. They say it was on purpose, because Duda said her party was boring.\nDuda swears she'll show up anyway. Grab the popcorn.|Jade organizó una salida el sábado y «se olvidó» de invitar a Duda. Dicen que fue a propósito, porque Duda dijo que su fiesta era aburrida.\nDuda jura que va a aparecer de todos modos. Prepara las palomitas.|Jade hat für Samstag einen Ausflug organisiert und „vergessen“, Duda einzuladen. Angeblich war es Absicht, weil Duda ihre Party langweilig genannt hatte.\nDuda schwört, sie taucht trotzdem auf. Holt schon mal das Popcorn."],
["EX-CRUSH ALERT|EX-CRUSH ALERT|EX-CRUSH ALERT|EX-CRUSH ALERT","Superou mesmo ou só mudou de estratégia?|Really over it, or just a new strategy?|¿Lo superó o solo cambió de estrategia?|Wirklich drüber weg oder nur neue Strategie?","💔","A Mel diz que superou o ex, mas foi vista perguntando para metade da escola quem é a nova paixão dele. Fontes garantem que ela até stalkeou a lista de seguidores às duas da manhã.\nSuperou nada, a Mel é a rainha da fingição.|Mel says she's over her ex, yet she was seen asking half the school who his new crush is. Sources swear she even stalked his followers list at two in the morning.\nShe's not over anything, Mel is the queen of pretending.|Mel dice que superó a su ex, pero la vieron preguntándole a medio colegio quién es su nueva ilusión. Fuentes aseguran que hasta stalkeó su lista de seguidores a las dos de la madrugada.\nQué va a haberlo superado, Mel es la reina del fingimiento.|Mel sagt, sie sei über ihren Ex hinweg, wurde aber dabei gesehen, wie sie die halbe Schule fragte, wer seine neue Flamme ist. Quellen schwören, sie habe sogar um zwei Uhr nachts seine Followerliste durchstöbert.\nÜberhaupt nicht drüber weg, Mel ist die Königin des Vortäuschens."],
["PLOT TWIST|PLOT TWIST|PLOT TWIST|PLOT TWIST","Era TUDO mentira?|Was it ALL a lie?|¿Era TODO mentira?|War ALLES gelogen?","🕵️","A aluna nova, a Aysha, contou que já morou em três países, mas a história muda a cada vez: a escola, a cidade, até o motivo da mudança. Dizem que ela nunca saiu da cidade e inventa tudo para parecer interessante.\nQuem acredita nessa mentirosa ainda acredita em Papai Noel.|The new student, Aysha, said she's lived in three countries, but the story changes every time: the school, the city, even the reason she moved. They say she's never left town and makes it all up to seem interesting.\nAnyone who believes that liar still believes in Santa Claus.|La alumna nueva, Aysha, contó que vivió en tres países, pero la historia cambia cada vez: el colegio, la ciudad, hasta el motivo de la mudanza. Dicen que nunca salió de la ciudad y lo inventa todo para parecer interesante.\nQuien le cree a esa mentirosa todavía cree en Papá Noel.|Die Neue, Aysha, erzählte, sie habe in drei Ländern gelebt, aber die Geschichte ändert sich jedes Mal: Schule, Stadt, sogar der Umzugsgrund. Angeblich war sie nie aus der Stadt raus und erfindet alles, um interessant zu wirken.\nWer dieser Lügnerin glaubt, glaubt auch noch an den Weihnachtsmann."],
["O GRANDE MISTÉRIO|THE GREAT MYSTERY|EL GRAN MISTERIO|DAS GROSSE RÄTSEL","Quem sou eu? Vocês nunca vão descobrir|Who am I? You'll never find out|¿Quién soy? Nunca lo descubrirán|Wer ich bin? Das findet ihr nie heraus","👁️","Eu vejo tudo. Sei quem colou na prova, quem apagou a mensagem e quem fingiu que estava tudo bem. E sim, eu leio os comentários me chamando de mentirosa, só podem ser os invejosos de sempre.\nVocês me procuram por aí, mas eu estou sentada na mesma sala que vocês. Vocês ainda não sabem de tudo.|I see everything. I know who cheated on the test, who deleted the message and who pretended everything was fine. And yes, I read the comments calling me a liar, it must be the usual jealous crowd.\nYou're looking for me out there, but I'm sitting in the same room as you. You still don't know everything.|Yo lo veo todo. Sé quién copió en el examen, quién borró el mensaje y quién fingió que todo estaba bien. Y sí, leo los comentarios que me llaman mentirosa, deben de ser los envidiosos de siempre.\nMe buscan por ahí, pero estoy sentada en la misma sala que ustedes. Todavía no lo saben todo.|Ich sehe alles. Ich weiß, wer in der Klausur abgeschrieben, wer die Nachricht gelöscht und wer so getan hat, als wäre alles gut. Und ja, ich lese die Kommentare, die mich Lügnerin nennen, das sind bestimmt die üblichen Neider.\nIhr sucht mich da draußen, aber ich sitze im selben Raum wie ihr. Ihr wisst noch lange nicht alles."]
];
const $=s=>document.querySelector(s),LI=["pt","en","es","de"];
let lang="pt",lvl=matchMedia("(prefers-reduced-motion:reduce)").matches?1:4,io;

function render(){
  const t=I[lang],k=LI.indexOf(lang);
  document.documentElement.lang={pt:"pt-BR",en:"en",es:"es",de:"de"}[lang];
  $("#slogan").textContent=t.slogan;$("#last").textContent=t.last;
  $("#llang").textContent=t.lang+":";$("#lanim").textContent=t.anim+":";
  $("#quote").textContent=t.q;$("#sig").textContent=t.sig;$("#foot").textContent=t.foot;
  $("#lv").innerHTML=t.lv.map((n,i)=>`<option value="${i+1}"${i+1===lvl?" selected":""}>${n}</option>`).join("");
  document.querySelectorAll(".lg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  const heads=S.map(s=>s[1].split("|")[k]+" "+s[2]);
  $("#rail").textContent=heads.join("   💋   ");
  $("#grid").innerHTML=S.map((s,i)=>{
    const p=s[3].split("|")[k].split("\n");
    return `<article class="card pre"><div class="n">${String(i+1).padStart(2,"0")}</div><button class="hd" aria-expanded="false" aria-controls="b${i}"><span class="tag">${s[0].split("|")[k]}</span><span class="h2">${s[1].split("|")[k]} ${s[2]}</span><span class="chev" aria-hidden="true">▾</span></button><div class="bd" id="b${i}"><div class="bd-in"><p>${p[0]}</p><p class="q">${p[1]}</p></div></div></article>`;
  }).join("");
  observe();
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
}
/* brilho no logo */
const logo=document.querySelector(".logo");
for(let i=0;i<14;i++){const s=document.createElement("span");s.className="sp";s.textContent="✦";
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${10+Math.random()*16}px;animation-delay:${(Math.random()*2).toFixed(2)}s`;logo.appendChild(s)}
const setSp=()=>document.querySelectorAll(".sp").forEach((s,i)=>s.style.display=lvl>1&&i<[0,4,8,12,14][lvl-1]?"":"none");
/* glitter em tela cheia */
const cv=$("#fx"),cx=cv.getContext("2d"),CNT=[0,10,25,55,110],SPD=[0,.35,.6,1,1.8],COL=["#fff","#ffd86b","#ff2d95","#b36bff","#7fd8ff"];
let W,H,P=[],T=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
const mk=()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+1,vx:(Math.random()-.5)*.4,vy:-(Math.random()*.5+.15),p:Math.random()*6.28,c:COL[Math.random()*5|0]});
function star(x,y,r){cx.beginPath();cx.moveTo(x,y-r*2);cx.quadraticCurveTo(x,y,x+r*2,y);cx.quadraticCurveTo(x,y,x,y+r*2);cx.quadraticCurveTo(x,y,x-r*2,y);cx.quadraticCurveTo(x,y,x,y-r*2);cx.fill()}
function loop(){
  cx.clearRect(0,0,W,H);const s=SPD[lvl-1];
  for(const q of P){q.x+=q.vx*s;q.y+=q.vy*s;q.p+=.05*s;if(q.y<-10){q.y=H+10;q.x=Math.random()*W}
    cx.globalAlpha=.35+.65*Math.abs(Math.sin(q.p));cx.fillStyle=q.c;star(q.x,q.y,q.r)}
  T=T.filter(q=>q.l>0);
  for(const q of T){q.x+=q.vx;q.y+=q.vy;q.vy+=.04;q.l--;cx.globalAlpha=q.l/40;cx.fillStyle=q.c;star(q.x,q.y,q.r)}
  requestAnimationFrame(loop);
}
addEventListener("resize",size);
addEventListener("pointermove",e=>{
  if(lvl>=4)for(let i=0;i<(lvl===5?3:1);i++)T.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*2,vy:Math.random()*-1.5,r:Math.random()*2+1,l:40,c:COL[Math.random()*5|0]});
  if(lvl===5){const c=e.target.closest&&e.target.closest(".card");
    if(c){const b=c.getBoundingClientRect();c.style.setProperty("--ry",((e.clientX-b.left)/b.width-.5)*10+"deg");c.style.setProperty("--rx",(.5-(e.clientY-b.top)/b.height)*10+"deg")}}
});
document.addEventListener("pointerout",e=>{const c=e.target.closest&&e.target.closest(".card");if(c){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
function setLvl(n){lvl=n;document.documentElement.dataset.lvl=n;P=Array.from({length:CNT[n-1]},mk);setSp()}
document.querySelectorAll(".lg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
$("#lv").onchange=e=>setLvl(+e.target.value);
$("#grid").addEventListener("click",e=>{const b=e.target.closest(".hd");if(!b)return;const c=b.parentElement,o=c.classList.toggle("open");b.setAttribute("aria-expanded",o)});
size();render();setLvl(lvl);loop();
</script>
</body>
</html>
